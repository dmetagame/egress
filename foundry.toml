[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
fs_permissions = [{ access = "read-write", path = "./reports/generated" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
